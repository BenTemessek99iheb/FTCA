<section class="sec-programme" id="programme">
  <div class="wrap">
    <div class="shead reveal" appRevealOnScroll>
      <span class="eyebrow">Programme</span>
      <h2>Les films de l'édition 2026</h2>
      <p>Sept nuits de projections à Kélibia. Aperçu de la sélection — {{ totalFilms }} films au programme complet.</p>
    </div>

    <div class="day-jump reveal" appRevealOnScroll>
      <a *ngFor="let day of days" routerLink="/fifak-2026/programme" [queryParams]="{ day }">
        {{ day }} Août
      </a>
    </div>

    <div class="programme-grid reveal reveal-stagger" appRevealOnScroll>
      <app-film-card *ngFor="let film of previewFilms; let i = index" [film]="film" [style.--i]="i"></app-film-card>
    </div>

    <div class="programme-cta">
      <a routerLink="/fifak-2026/programme" class="btn btn--solid">
        Voir tout le programme ({{ totalFilms }} films)
      </a>
    </div>
  </div>
</section>
