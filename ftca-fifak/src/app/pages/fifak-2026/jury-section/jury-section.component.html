<section class="sec-jury" id="jury">
  <div class="wrap">
    <div class="shead reveal" appRevealOnScroll>
      <div class="shead__text">
        <span class="eyebrow">Le Jury</span>
        <h2>Ceux qui départageront l'édition 2026</h2>
        <p>Un jury national et un jury international, réunis pour évaluer la sélection officielle de cette 39ᵉ édition.</p>
      </div>
    </div>

    <div class="jury-group reveal" appRevealOnScroll>
      <div class="jury-group__label"><h3>Jury National</h3><span>— Tunisie</span></div>
      <app-horizontal-scroller [showFades]="false" [gap]="34" trackPadding="6px 4px 20px" [center]="true">
        <button type="button" class="jury-avatar" *ngFor="let member of nationalMembers" (click)="selectMember(member)">
          <div class="jury-avatar__ring"><img [src]="member.photoUrl" alt="" loading="lazy" /></div>
          <h4>{{ member.name }}</h4>
          <span>{{ member.role }}</span>
        </button>
      </app-horizontal-scroller>
    </div>

    <div class="jury-group reveal" appRevealOnScroll>
      <div class="jury-group__label"><h3>Jury International</h3><span>—</span></div>
      <app-horizontal-scroller [showFades]="false" [gap]="34" trackPadding="6px 4px 20px" [center]="true">
        <button type="button" class="jury-avatar" *ngFor="let member of internationalMembers" (click)="selectMember(member)">
          <div class="jury-avatar__ring"><img [src]="member.photoUrl" alt="" loading="lazy" /></div>
          <h4>{{ member.name }}</h4>
          <span>{{ member.role }}</span>
        </button>
      </app-horizontal-scroller>
    </div>
  </div>

  <app-jury-member-modal *ngIf="selectedMember() as m" [member]="m" (close)="closeModal()"></app-jury-member-modal>
</section>
