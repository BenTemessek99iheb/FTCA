<section class="sec-nashriya" id="nashriya">
  <div class="wrap">
    <div class="nash-intro reveal" appRevealOnScroll>
      <span class="eyebrow">Nashriya — نشرية</span>
      <h2>Le journal quotidien du festival</h2>
      <p>Chaque soir du festival, E'Nashriya raconte la journée écoulée à Kélibia — publiée en anglais et en arabe, comme le veut la tradition du festival.</p>
    </div>

    <app-nashriya-spread
      *ngFor="let entry of entries; let i = index"
      [entry]="entry"
      [folioNumber]="folioNumber(i)"
    ></app-nashriya-spread>
  </div>
</section>
