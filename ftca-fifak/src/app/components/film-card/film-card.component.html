<article
  class="film-card"
  role="button"
  tabindex="0"
  [attr.aria-label]="'Voir les détails de ' + film.title"
  (click)="openDetail()"
  (keydown.enter)="openDetail()"
  (keydown.space)="openDetail(); $event.preventDefault()"
>
  <div class="film-card__img">
    <div class="film-card__tags">
      <div class="film-card__badges">
        <span class="film-card__cat" [style.background]="'var(--cat-' + film.category + ')'">{{ categoryLabels[film.category] }}</span>
        <span class="film-card__genre">{{ genreLabels[film.genre] }}</span>
      </div>
      <span class="film-card__date">{{ film.day }} Août</span>
    </div>
    <img [src]="film.posterUrl" alt="" loading="lazy" />
  </div>
  <div class="film-card__body">
    <h4>{{ film.title }}</h4>
    <div class="film-card__meta">{{ film.director }} — {{ film.country }}</div>

    <div class="film-card__lang-toggle" *ngIf="hasArabic()">
      <button type="button" [class.is-active]="activeLang() === 'en'" (click)="$event.stopPropagation(); setLang('en')">EN</button>
      <button type="button" [class.is-active]="activeLang() === 'ar'" (click)="$event.stopPropagation(); setLang('ar')">AR</button>
    </div>

    <p
      class="film-card__synopsis"
      [class.is-expanded]="expanded()"
      [class.is-arabic]="activeLang() === 'ar'"
      [dir]="activeLang() === 'ar' ? 'rtl' : 'ltr'"
    >
      {{ activeSynopsis() }}
    </p>
    <button type="button" class="film-card__toggle" (click)="$event.stopPropagation(); toggleExpanded()">
      {{ expanded() ? 'Réduire' : 'Lire plus' }}
    </button>
  </div>

  <app-film-detail-modal *ngIf="detailOpen()" [film]="film" (close)="closeDetail()"></app-film-detail-modal>
</article>
