<header [ngClass]="navClasses()" class="nav">
  <div class="wrap">
    <a routerLink="/" class="nav__brand">
      <span class="mark">
        <picture style="display: contents">
          <source srcset="assets/ftca-logo-mark.webp" type="image/webp" />
          <img src="assets/ftca-logo-mark.webp" alt="FTCA — Fédération Tunisienne des Cinéastes Amateurs" loading="eager" />
        </picture>
      </span>
      <span>
        FTCA
        <small>Cinéastes Amateurs</small>
      </span>
    </a>

    <nav class="nav__links">
      <div class="nav__item">
        <a routerLink="/" fragment="ftca" class="nav__link">FTCA</a>
      </div>
      <div class="nav__item">
        <a routerLink="/" fragment="fifak" class="nav__link">FIFAK <i class="fa-solid fa-chevron-down"></i></a>
        <div class="dropdown">
          <a routerLink="/fifak-2026" routerLinkActive="is-current" [routerLinkActiveOptions]="{ exact: true }">
            FIFAK 2026 <span class="tag">New</span>
          </a>
          <a routerLink="/" fragment="fifak">Le festival</a>
          <a routerLink="/fifak-2026" fragment="programme">Programme</a>
          <a routerLink="/fifak-2026" fragment="programme">Compétition</a>
          <a routerLink="/fifak-2026" fragment="jury">Jury</a>
          <a routerLink="/" fragment="fifak">Palmarès</a>
          <a routerLink="/" fragment="archives">Archives / éditions</a>
        </div>
      </div>
      <div class="nav__item">
        <a routerLink="/" fragment="articles" class="nav__link">Articles</a>
      </div>
      <div class="nav__item">
        <a routerLink="/" fragment="contact" class="nav__link">Contact</a>
      </div>
    </nav>

    <div class="nav__actions">
      <a routerLink="/fifak-2026" class="btn btn--ghost-light">FIFAK 2026</a>
      <button
        class="burger"
        [class.is-open]="isMobileMenuOpen"
        (click)="toggleMobileMenu()"
        aria-label="Menu"
        [attr.aria-expanded]="isMobileMenuOpen"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<app-mobile-menu [isOpen]="isMobileMenuOpen" (close)="closeMobileMenu()"></app-mobile-menu>
