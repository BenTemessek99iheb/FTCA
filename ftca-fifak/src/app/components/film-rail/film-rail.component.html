<nav class="rail" aria-hidden="true">
  <div class="rail__frame">FRAME <span>{{ currentFrameLabel() }}</span> / {{ totalFrameLabel() }}</div>
  <div class="rail__track">
    <div
      *ngFor="let holeIndex of holes"
      class="rail__hole"
      [class.is-active]="isHoleActive(holeIndex)"
    ></div>
  </div>
</nav>
