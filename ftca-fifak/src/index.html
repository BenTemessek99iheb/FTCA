<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>FTCA — Fédération Tunisienne des Cinéastes Amateurs</title>
  <meta name="description" content="FTCA — Fédération Tunisienne des Cinéastes Amateurs. Organisatrice du FIFAK, Festival International des Films Amateurs de Kélibia.">

  <!-- Open Graph / Twitter Card — statiques et communs à tout le site : pas
       de SSR/prerendering ici (build 100% statique, voir DEPLOYMENT.md), donc
       pas d'aperçu dynamique par page (ex: nom du club sur un lien
       /inscription?club=...) sans changement d'architecture plus lourd que
       "ajouter un bouton partager". og:url volontairement omis : une valeur
       figée sur la page d'accueil aurait pu faire pointer un lien partagé
       (ex: /inscription?club=...) vers autre chose que sa vraie destination
       une fois "dépliée" par Facebook/WhatsApp. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FTCA — Fédération Tunisienne des Cinéastes Amateurs">
  <meta property="og:title" content="FTCA — Fédération Tunisienne des Cinéastes Amateurs">
  <meta property="og:description" content="Organisatrice du FIFAK, Festival International des Films Amateurs de Kélibia. Rejoignez un club de cinéastes amateurs près de chez vous.">
  <meta property="og:image" content="https://res.cloudinary.com/ykjb5rh5/image/upload/f_jpg,q_auto,w_1200,h_630,c_fill,g_auto/assets/wallp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FTCA — Fédération Tunisienne des Cinéastes Amateurs">
  <meta name="twitter:description" content="Organisatrice du FIFAK, Festival International des Films Amateurs de Kélibia. Rejoignez un club de cinéastes amateurs près de chez vous.">
  <meta name="twitter:image" content="https://res.cloudinary.com/ykjb5rh5/image/upload/f_jpg,q_auto,w_1200,h_630,c_fill,g_auto/assets/wallp">

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">

  <!-- Polices auto-hébergées (voir src/app/styles/_fonts.scss) : plus de dépendance
       Google Fonts CDN. Archivo est la police de corps utilisée partout dès le
       premier rendu (navbar, hero) -> préchargée explicitement. -->
  <link rel="preload" href="assets/fonts/Archivo-400_800-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Archivo-400_800-normal-latin-ext.woff2" as="font" type="font/woff2" crossorigin>

  <!-- LCP de la landing (/) : sans SSR, le scanner de préchargement du navigateur
       ne voit que ce HTML statique (le <link> injecté par HeroComponent arrive
       après le bootstrap Angular, trop tard pour ce même gain). Route /fifak-2026
       non couverte ici (image de hero différente) — géré dynamiquement à défaut,
       voir PERFORMANCE.md. -->
  <link rel="preload" href="assets/wallp.webp" as="image" fetchpriority="high">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#e8153c">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
